openapi: 3.0.3
info:
  title: MiGO Netatmo API (observed, unofficial)
  version: 0.2.0
servers:
- url: https://app.netatmo.net
paths:
  /oauth2/token:
    post:
      operationId: token
      summary: Exchange OAuth credentials
      description: Unofficial MiGO endpoint. Unknown fields are retained by the client.
        See docs/api/reference.md for observed payloads.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - client_id
              - client_secret
              - grant_type
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                grant_type:
                  type: string
                  enum:
                  - password
                  - refresh_token
                username:
                  type: string
                password:
                  type: string
                refresh_token:
                  type: string
                scope:
                  type: string
                user_prefix:
                  type: string
      responses:
        '200':
          description: Backend JSON payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Request rejected
        '401':
          description: Authentication rejected
        '429':
          description: Rate limited
        '500':
          description: Backend failure
