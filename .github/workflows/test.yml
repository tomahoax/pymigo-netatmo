name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        aiohttp: [latest]
        include:
          - python: '3.11'
            aiohttp: '3.10.7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - if: matrix.aiohttp != 'latest'
        run: python -m pip install 'aiohttp==${{ matrix.aiohttp }}'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=pymigo_netatmo --cov-report=term-missing
