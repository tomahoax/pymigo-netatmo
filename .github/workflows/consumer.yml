name: Consumer compatibility
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Integration revision to validate against this library
        required: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: library
      - uses: actions/checkout@v5
        with:
          repository: tomahoax/ha-migo-netatmo
          ref: ${{ inputs.ref }}
          path: integration
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e './library[dev]'
      - run: python -m pip install -e './integration[dev]' --no-deps
      - run: python -m pip install homeassistant pytest-homeassistant-custom-component voluptuous
      - run: pytest integration/tests
